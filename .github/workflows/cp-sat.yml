name: OR-Tools CP-SAT 4-Way Symbolic Equivalence CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-4way-symbolic-equivalence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM, CMake, Ninja, and OR-Tools dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 curl ca-certificates \
            clang llvm-dev libclang-dev

      - name: Download Google OR-Tools C++ SDK (v9.12.4544)
        run: |
          mkdir -p /opt/ortools
          curl -sSL "https://github.com/google/or-tools/releases/download/v9.12/or-tools_amd64_ubuntu-24.04_cpp_v9.12.4544.tar.gz" \
            | tar -xz -C /opt/ortools --strip-components=1

      - name: Build FEX LLVM-Arm64EC Offline AOT Compiler (fex-aot-pe)
        run: |
          chmod +x ./mk-fex-aot-pe.sh
          ./mk-fex-aot-pe.sh

      - name: Dump 4-Way Lifted/Lowered/JIT JSON Across Benchmark & Game Binaries
        run: |
          mkdir -p aot_out docs
          EXTRA_BINS=()
          if [ -f kittytoy/KittyToy.exe ]; then
            EXTRA_BINS+=(kittytoy/KittyToy.exe)
          fi
          ./build/Bin/fex-aot-pe \
            --output-dir aot_out \
            --audit \
            --json-out aot_out/benchmark_summary.json \
            --dump-symexec-json aot_out/symexec_all_benchmarks.json \
            samples/hello64.exe \
            samples/fex_arm64ec_test.exe \
            samples/d3d11_bc7_sample.exe \
            samples/fex_arm64ec_e2e_suite.exe \
            "${EXTRA_BINS[@]}"

      - name: Build and Run Google OR-Tools CP-SAT 4-Way Symbolic Equivalence Verifier
        run: |
          g++ -std=c++20 -O2 -DOR_PROTO_DLL= -include cstdint \
            -I/opt/ortools/include \
            symexec_verifier/fex_aot_symexec_verifier.cpp \
            -L/opt/ortools/lib -Wl,-rpath,/opt/ortools/lib \
            -lortools -lpthread \
            -o symexec_verifier/fex_aot_symexec_verifier
          ./symexec_verifier/fex_aot_symexec_verifier \
            aot_out/symexec_all_benchmarks.json \
            docs/OR_Tools_Symbolic_Equivalence_Report.md \
            aot_out/symexec_report.json \
            aot_out/symexec_constraints_equations.txt \
            aot_out/symbolic_ir_dump.txt

      - name: Upload CP-SAT Equivalence Report & Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-sat-equivalence-report
          path: |
            docs/OR_Tools_Symbolic_Equivalence_Report.md
            aot_out/symexec_report.json
            aot_out/benchmark_summary.json
            aot_out/symexec_constraints_equations.txt
            aot_out/symbolic_ir_dump.txt
            aot_out/symexec_all_benchmarks.json
