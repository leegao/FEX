      - name: Run samples/d3d11_bc7_sample.exe (JIT)
        if: always()
        env:
          WINEPREFIX: ${{ github.workspace }}/wineprefix
          PATH: /opt/droiddeck-proton/files/bin:/opt/llvm-mingw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          LD_LIBRARY_PATH: /opt/droiddeck-proton/files/lib/aarch64-linux-gnu:/opt/droiddeck-proton/files/lib/wine/aarch64-unix
          FEX_SILENTLOG: 0
          FEX_OUTPUTLOG: stderr
        run: |
          if [ -f samples/d3d11_bc7_sample.exe ]; then
            mkdir -p screenshots
            timeout 30s xvfb-run -a bash -c '
              rm -f screenshot_ready.flag
              wine close_bc7_window.exe "screenshots/d3d11_bc7_sample_jit.bmp" &
              CLOSER_PID=$!

              (
                for i in $(seq 1 100); do
                  if [ -f screenshot_ready.flag ] || xwininfo -root -tree 2>/dev/null | grep -Ei "BC7 Sample|D3D11Window" >/dev/null; then
                    sleep 1.5
                    import -window root screenshots/d3d11_bc7_sample_jit.png 2>/dev/null || xwd -root -silent -out screenshots/d3d11_bc7_sample_jit.xwd 2>/dev/null || true
                    break
                  fi
                  sleep 0.1
                done
              ) &
              SHOT_PID=$!

              wine samples/d3d11_bc7_sample.exe
              RC=$?
              wait $CLOSER_PID 2>/dev/null || true
              wait $SHOT_PID 2>/dev/null || true

              if [ -f screenshots/d3d11_bc7_sample_jit.xwd ] && [ ! -f screenshots/d3d11_bc7_sample_jit.png ]; then
                convert screenshots/d3d11_bc7_sample_jit.xwd screenshots/d3d11_bc7_sample_jit.png 2>/dev/null || true
              fi
              if [ -f screenshots/d3d11_bc7_sample_jit.bmp ] && [ ! -f screenshots/d3d11_bc7_sample_jit.png ]; then
                convert screenshots/d3d11_bc7_sample_jit.bmp screenshots/d3d11_bc7_sample_jit.png 2>/dev/null || true
              fi
              exit $RC
            ' || true
            ls -la screenshots/
          fi

